version: 2

name: DTR_ADJUDICATOR_APP
database: SNOWFLAKE_APPS
schema: PUBLIC
query_warehouse: SNOWFLAKE_APPS_QUERY_WH

label: "DTR Travel Entitlement Adjudicator"
description: "DTR Part I travel determinations from a fine-tuned strands-decider and a frontier LLM side by side, with calibrated abstention to a human-review queue."
icon: public/icon.svg

# npm registry egress for the build
build_eai: APPS_BUILD_EAI

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - "*.tsbuildinfo"
  - sql

# Egress from the running app to the decider's public endpoint, and the PAT it authenticates with.
external_access_integrations:
  - DTR_DECIDER_EAI

secrets:
  - name: DECIDER_PAT
    secret: DECIDER_BENCH.BENCH.DTR_DECIDER_PAT

environment_variables:
  - name: LLM_WAREHOUSE
    value: DECIDER_BENCH_WH

install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    # For standalone mode
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    # Avoid packaging extra node_modules since standalone includes its own
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]
