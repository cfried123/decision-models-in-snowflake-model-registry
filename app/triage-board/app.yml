version: 2

name: DECIDER_TRIAGE_BOARD
database: SNOWFLAKE_APPS
schema: PUBLIC
query_warehouse: SNOWFLAKE_APPS_QUERY_WH

label: "Decision triage board"
description: "The same support tickets triaged live by decider-2b and a frontier LLM, with throughput, latency and cost side by side."
icon: public/icon.svg

# npm registry egress for the build
build_eai: APPS_BUILD_EAI

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - "*.tsbuildinfo"
  - sql

# Egress from the running app to decider-2b's public endpoint, and the PAT it authenticates with.
external_access_integrations:
  - DECIDER_DEMO_EAI

secrets:
  - name: DECIDER_PAT
    secret: DEVREL.DECISION_MODEL_BLOG.DECIDER_DEMO_PAT

environment_variables:
  - name: LLM_WAREHOUSE
    value: DECIDER_DEMO_WH

install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    # For standalone mode
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    # Avoid packaging extra node_modules since standalone includes its own
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]
